# Вся система одной командой:  docker compose up --build
# Остановка:                   docker compose down        (данные БД сохраняются в volume pgdata)
# Полный сброс:                docker compose down -v
name: user-platform

networks:
  platform:

volumes:
  pgdata:

services:

  # ===================== ИНФРАСТРУКТУРА =====================

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"            # необязательно: для подключения с хоста (DBeaver, psql)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_service"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [platform]

  kafka:
    image: apache/kafka:3.9.0           # один узел в режиме KRaft (без ZooKeeper)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # kafka:9092 - для контейнеров; localhost:29092 - для приложений на хосте
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"          # необязательно: для приложений, запущенных на хосте
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [platform]

  mailpit:
    image: axllent/mailpit             # ловушка писем: SMTP :1025, веб-интерфейс и API :8025
    ports:
      - "8025:8025"
    networks: [platform]

  # ===================== SPRING CLOUD =====================

  config-server:
    build:
      context: .
      args:
        MODULE: config-server
    environment:
      # читаем конфигурацию из примонтированной папки: правишь файл на хосте и перезапускаешь без пересборки образа
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo/
    volumes:
      - ./config-server/src/main/resources/config-repo:/config-repo:ro
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8888/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks: [platform]

  discovery-server:
    build:
      context: .
      args:
        MODULE: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8761/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks: [platform]

  # ===================== ПРИЛОЖЕНИЯ =====================
  # Общее для приложений: профиль docker + НЕОБЯЗАТЕЛЬНЫЙ (без optional:) импорт конфигурации:
  # если Config Server недоступен, сервис не стартует с пустым конфигом, а перезапускается.

  user-service:
    build:
      context: .
      args:
        MODULE: user-service
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # порт наружу не публикуется: клиенты ходят только через API Gateway.
    # Для отладки раскомментируй:
    # ports:
    #   - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [platform]

  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    # ports:
    #   - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [platform]

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "8080:8080"            # единственная точка входа для клиентов
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [platform]
