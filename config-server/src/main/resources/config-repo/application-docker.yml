# Общие настройки профиля "docker" (подмешиваются ко ВСЕМ сервисам, запущенным с этим профилем).
# Внутри docker-сети сервисы обращаются друг к другу по именам из docker-compose.yml.
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    registry-fetch-interval-seconds: 5      # быстрее видеть новые/упавшие экземпляры
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
