server:
  port: 8082

spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: org.example.notification.dto.UserEventMessage
        spring.json.use.type.headers: false
        spring.json.trusted.packages: org.example.notification.dto

  # Логин и пароль почты здесь НЕ хранятся: передаются переменными окружения
  # SPRING_MAIL_USERNAME и SPRING_MAIL_PASSWORD при запуске notification-service.
  mail:
    host: smtp.gmail.com
    port: 587
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  kafka:
    topic: user-events
